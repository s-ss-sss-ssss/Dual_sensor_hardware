# OpenOCD board configuration for MagGrad Dual V1
# MCU: STM32H743VIT6
# Debug probe: ST-Link, connected through SWD

source [find interface/stlink.cfg]
transport select hla_swd

# 4 MHz is supported by ST-Link and is a conservative speed for board wiring.
# If the connection is unstable, override it on the command line, for example:
#   openocd -f openocd.cfg -c "adapter speed 1000"
adapter speed 4000

source [find target/stm32h7x.cfg]

# The board exposes the MCU reset signal to the debug connector.
reset_config srst_only srst_nogate
